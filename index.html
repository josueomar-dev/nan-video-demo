<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NaN Video Streaming Demo</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b0b0f;
      color: #e8e8ee;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { width: min(960px, 92vw); padding: 32px 0; }
    h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.02em; margin: 0 0 4px; }
    p.hint { margin: 0 0 20px; color: #8b8b9a; font-size: 0.85rem; }
    video { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; display: block; }
  </style>
</head>
<body>
  <main>
    <h1>NaN Video Streaming Demo</h1>
    <p class="hint">Static MP4 served by Nginx with HTTP range requests.</p>
    <video controls playsinline preload="metadata">
      <source src="/video.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </main>
</body>
</html>
